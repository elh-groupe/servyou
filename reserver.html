<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réserver une table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Page de réservation : nuit marine, halos lents, carte en verre, accents or. Un seul thème, voulu. */
:root{
  --bg:#0d1330;--ink:#f4efe4;--muted:#a9b0cb;--line:rgba(255,255,255,.14);--field:rgba(255,255,255,.07);
  --gold:#e2b765;--gold-2:#c9982f;--navy:#0d1330;--danger:#ff9d94;
  --display:"Fraunces",Georgia,serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px 96px;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
body::before{width:520px;height:520px;left:-140px;top:-160px;background:#3a4aa0;opacity:.55;animation:drift1 18s ease-in-out infinite alternate}
body::after{width:460px;height:460px;right:-140px;bottom:-140px;background:#a8752a;opacity:.38;animation:drift2 22s ease-in-out infinite alternate}
.card{position:relative;z-index:1;width:100%;max-width:520px;padding:34px 28px 28px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:rise .7s var(--ease) both}
.card::before{content:"RÉSERVATION";display:block;text-align:center;font-size:11px;font-weight:700;letter-spacing:.32em;color:var(--gold);margin-bottom:10px}
h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;text-align:center;letter-spacing:-.01em;text-wrap:balance}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 26px}
.subtitle::after{content:"";display:block;width:44px;height:2px;border-radius:2px;background:var(--gold);margin:16px auto 0;animation:grow .8s .3s var(--ease) both}
.field{margin-bottom:18px;animation:rise .6s var(--ease) both}
form>.field:nth-child(1){animation-delay:.08s}form>.row:nth-child(2) .field{animation-delay:.14s}form>.field:nth-child(3){animation-delay:.2s}form>.field:nth-child(4){animation-delay:.26s}form>.row:nth-child(5) .field{animation-delay:.32s}form>.field:nth-child(6){animation-delay:.38s}
label,.lab{display:block;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.req{color:var(--gold);margin-left:2px}
input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit;font-size:16px;transition:border-color .2s,box-shadow .2s,background-color .2s}
input::placeholder,textarea::placeholder{color:#7f87a6}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(226,183,101,.18);background:rgba(255,255,255,.1)}
textarea{resize:vertical;min-height:76px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:440px){.row{grid-template-columns:1fr}.card{padding:28px 20px 22px}h1{font-size:26px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .18s var(--ease),border-color .2s,background-color .2s,color .2s;animation:rise .4s var(--ease) both}
.chip:hover{border-color:var(--gold);transform:translateY(-2px)}
.chip:active{transform:scale(.94)}
.chip.on{border-color:var(--gold);background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--navy);box-shadow:0 8px 20px rgba(226,183,101,.3);animation:pick .3s var(--ease)}
.grid .chip{min-height:54px;border-radius:14px}
.primary{position:relative;overflow:hidden;display:block;width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--navy);font:inherit;font-weight:800;font-size:16px;letter-spacing:.01em;cursor:pointer;margin-top:24px;box-shadow:0 12px 30px rgba(226,183,101,.28);transition:transform .2s var(--ease),box-shadow .2s var(--ease);animation:rise .6s .44s var(--ease) both}
.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.6s 1.2s ease-in-out infinite}
.primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(226,183,101,.38)}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.7;cursor:progress;transform:none}
.primary:disabled::after{animation:shine 1s linear infinite}
.msg{text-align:center;padding:26px 6px 10px;animation:rise .6s var(--ease) both}
.msg h2{font-family:var(--display);font-weight:600;font-size:26px;margin-bottom:10px}
.msg p{color:var(--muted)}
.msg #recap{color:var(--ink);font-weight:600}
.tick{width:76px;height:76px;margin:0 auto 18px;display:block}
.tick circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:214;stroke-dashoffset:214;animation:draw .7s var(--ease) forwards}
.tick path{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .55s var(--ease) forwards}
.err{background:rgba(255,120,110,.14);border:1px solid rgba(255,157,148,.4);color:var(--danger);border-radius:12px;padding:11px 13px;margin-top:14px;font-size:14px;animation:shake .35s}
.muted{color:var(--muted);font-size:13px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#consent{position:fixed;z-index:2;left:0;right:0;bottom:0;background:rgba(13,19,48,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:13px;color:var(--muted);animation:rise .5s var(--ease) both}
#consent button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
#consent button.yes{background:var(--gold);border-color:var(--gold);color:var(--navy)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pick{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes drift1{to{transform:translate(120px,90px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-110px,-80px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tick circle,.tick path{stroke-dashoffset:0}}
</style>
</head>
<body>

<main class="card" id="card">
  <h1 id="title">Réserver une table</h1>
  <p class="subtitle" id="subtitle">Choisissez votre restaurant et votre créneau</p>

  <form id="form" novalidate>
    <div class="field" id="venueField">
      <span class="lab">Restaurant <span class="req">*</span></span>
      <div class="grid" id="venues"></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="date">Date <span class="req">*</span></label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="guests">Nombre de personnes <span class="req">*</span></label>
        <input type="number" id="guests" min="1" max="30" value="2" inputmode="numeric" required>
      </div>
    </div>
    <div class="field">
      <span class="lab">Heure <span class="req">*</span></span>
      <div class="chips" id="slots"></div>
    </div>
    <div class="field">
      <label for="name">Nom complet <span class="req">*</span></label>
      <input type="text" id="name" placeholder="Prénom et nom" autocomplete="name" maxlength="80" required>
    </div>
    <div class="row">
      <div class="field">
        <label for="phone">Téléphone <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="+212 6…" autocomplete="tel" maxlength="30" required>
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Facultatif" autocomplete="email" maxlength="120">
      </div>
    </div>
    <div class="field">
      <label for="notes">Demande particulière</label>
      <textarea id="notes" maxlength="400" placeholder="Anniversaire, chaise bébé, allergie…"></textarea>
    </div>
    <div class="hp" aria-hidden="true"><label for="website">Ne pas remplir</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
    <button class="primary" id="send">Envoyer ma demande de réservation</button>
    <div class="err" id="err" hidden></div>
    <p class="muted" style="margin-top:12px;text-align:center">Votre réservation est confirmée par téléphone par le restaurant.</p>
  </form>
</main>

<div id="consent" hidden>
  <span>Nous utilisons des cookies de mesure d'audience pour suivre nos campagnes.</span>
  <button type="button" id="cNo">Refuser</button><button type="button" class="yes" id="cYes">Accepter</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Page publique de réservation servYou : lit la fiche publique de l'établissement et dépose la demande dans la base. */
const FB={apiKey:"AIzaSyCWbEngQqwLYvAaSQ578rePe-dXvhEbPGg",authDomain:"servyou-elh.firebaseapp.com",projectId:"servyou-elh",storageBucket:"servyou-elh.firebasestorage.app",messagingSenderId:"637301546749",appId:"1:637301546749:web:645ff45b43c542f398e894"};
firebase.initializeApp(FB);
const db=firebase.firestore();
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const mins=t=>{const a=String(t).split(":").map(Number);return a[0]*60+(a[1]||0)};
const qs=new URLSearchParams(location.search);
// Lien propre à un établissement : reserver.html?r=identifiant. Sans identifiant, le client choisit.
const fixed=(qs.get("r")||location.hash.slice(1)||"").replace(/[^a-z0-9-]/gi,"").slice(0,40);
let VENUES={},venue="",time="",tracked=false;
// Campagne d'origine, gardée avec la réservation
const campaign=["utm_source","utm_medium","utm_campaign","utm_content","fbclid","gclid"].filter(k=>qs.get(k)).map(k=>k+"="+(k.endsWith("clid")?"oui":qs.get(k).slice(0,40))).join(" ").slice(0,200);

function closed(msg){$("card").innerHTML='<div class="msg"><h2>Réservation en ligne indisponible</h2><p></p></div>';$("card").querySelector("p").textContent=msg}
function fail(msg){const e=$("err");e.textContent=msg;e.hidden=!msg}
function renderVenues(){
  const ids=Object.keys(VENUES);
  $("venueField").hidden=ids.length<2;
  if(ids.length===1){$("title").textContent="Réserver une table — "+VENUES[venue].name;$("subtitle").textContent="Choisissez votre date et votre créneau";document.title="Réserver — "+VENUES[venue].name;return}
  $("venues").innerHTML="";
  ids.forEach(id=>{const b=document.createElement("button");b.type="button";b.className="chip"+(id===venue?" on":"");b.textContent=VENUES[id].name;b.setAttribute("aria-pressed",id===venue);
    b.addEventListener("click",()=>{venue=id;renderVenues();renderSlots();askConsent()});$("venues").appendChild(b)});
}
function renderSlots(){
  const box=$("slots"),day=$("date").value,v=VENUES[venue];box.innerHTML="";
  if(!day||!v)return;
  if(v.maxGuests)$("guests").max=v.maxGuests;
  const dow=new Date(day+"T12:00:00").getDay(),now=new Date(),today=iso(now),list=[];
  (v.shifts||[]).filter(s=>(s.days||[]).includes(dow)).forEach(s=>{
    const st=mins(s.start);let en=mins(s.end);if(en<=st)en+=1440;
    let last=en-60;if(/^\d{2}:\d{2}$/.test(v.lastOnline||"")){let lo=mins(v.lastOnline);if(lo<st)lo+=1440;last=Math.min(last,lo)}
    for(let m=st;m<=last;m+=30){
      if(day===today&&m<now.getHours()*60+now.getMinutes()+60)continue;   // pas de créneau dans moins d'une heure
      const t=pad(Math.floor(m/60)%24)+":"+pad(m%60);if(!list.includes(t))list.push(t)}
  });
  if(!list.includes(time))time="";
  if(!list.length){box.innerHTML='<span class="muted">Aucun créneau en ligne ce jour-là. Choisissez une autre date ou appelez le restaurant.</span>';return}
  list.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="chip"+(t===time?" on":"");b.textContent=t;b.addEventListener("click",()=>{time=t;renderSlots()});box.appendChild(b)});
}

/* ---------- suivi des campagnes : chargé seulement après accord du visiteur ---------- */
const hasTags=()=>{const c=VENUES[venue]||{};return !!(c.pixel||c.gtag||c.gtm)};
function askConsent(){
  if(!hasTags()||tracked)return;
  let v="";try{v=localStorage.getItem("resa-consent")||""}catch(e){}
  if(v==="oui")loadTags();else if(v!=="non")$("consent").hidden=false;
}
function setConsent(v){try{localStorage.setItem("resa-consent",v)}catch(e){}$("consent").hidden=true;if(v==="oui")loadTags()}
$("cYes").addEventListener("click",()=>setConsent("oui"));
$("cNo").addEventListener("click",()=>setConsent("non"));
function script(src){const s=document.createElement("script");s.async=true;s.src=src;document.head.appendChild(s)}
function loadTags(){
  if(tracked)return;tracked=true;
  const c=VENUES[venue]||{};window.dataLayer=window.dataLayer||[];
  if(/^\d{5,20}$/.test(c.pixel||"")){                       // Meta Pixel
    const n=window.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    window._fbq=n;n.push=n;n.loaded=true;n.version="2.0";n.queue=[];
    script("https://connect.facebook.net/en_US/fbevents.js");fbq("init",c.pixel);fbq("track","PageView")}
  if(/^(G|AW|GT)-[A-Za-z0-9-]{4,30}$/.test(c.gtag||"")){     // Google tag (Analytics 4 ou Google Ads)
    window.gtag=function(){dataLayer.push(arguments)};
    script("https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(c.gtag));gtag("js",new Date());gtag("config",c.gtag)}
  if(/^GTM-[A-Za-z0-9]{4,12}$/.test(c.gtm||"")){             // Google Tag Manager
    dataLayer.push({"gtm.start":Date.now(),event:"gtm.js"});script("https://www.googletagmanager.com/gtm.js?id="+encodeURIComponent(c.gtm))}
}
function trackBooking(d){
  if(!tracked)return;
  try{if(window.fbq)fbq("track","Schedule",{content_name:d.venueName,num_guests:d.covers});
    if(window.gtag)gtag("event","generate_lead",{restaurant:d.venueName,couverts:d.covers});
    dataLayer.push({event:"reservation_envoyee",restaurant:d.venueName,couverts:d.covers})}catch(e){}
}

/* ---------- envoi ---------- */
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const v=VENUES[venue];if(!v)return;
  const d={name:$("name").value.trim().slice(0,80),phone:$("phone").value.trim().slice(0,30),email:$("email").value.trim().slice(0,120),covers:parseInt($("guests").value,10)||0,date:$("date").value,time,
    table:"",pre:"pending",svc:"pending",status:"pending",source:"Site web",tags:[],note:$("notes").value.trim().slice(0,400),campaign,deposit:0,spend:0,walkin:false,duration:120,createdAt:new Date().toISOString(),web:true,clientId:""};
  if(!d.date)return fail("Choisissez une date.");
  if(!d.time)return fail("Choisissez une heure.");
  if(d.covers<1)return fail("Indiquez le nombre de personnes.");
  if(d.covers>30||(v.maxGuests&&d.covers>v.maxGuests))return fail("Pour un groupe de plus de "+(v.maxGuests||30)+" personnes, contactez directement le restaurant.");
  if(!d.name)return fail("Indiquez votre nom.");
  if(d.phone.replace(/\D/g,"").length<8)return fail("Indiquez un numéro de téléphone valide.");
  fail("");
  const btn=$("send");btn.disabled=true;btn.textContent="Envoi en cours…";
  try{
    if(!$("website").value)await db.collection("venues/"+venue+"/reservations").add(d);   // champ piège : rempli seulement par les robots
    trackBooking({venueName:v.name,covers:d.covers});
    const when=new Date(d.date+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    $("card").innerHTML='<div class="msg"><svg class="tick" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="34"/><path d="M24 39l10 10 19-21"/></svg><h2>Demande envoyée</h2><p id="recap"></p><p style="margin-top:12px">Le restaurant vous appelle pour confirmer votre table.</p></div>';
    $("recap").textContent=v.name+" — "+when+" à "+d.time+" — "+d.covers+" personne"+(d.covers>1?"s":"");
  }catch(x){btn.disabled=false;btn.textContent="Envoyer ma demande de réservation";fail("L'envoi n'a pas abouti. Réessayez ou appelez directement le restaurant.")}
});

/* ---------- démarrage ---------- */
const now=new Date(),max=new Date();max.setDate(max.getDate()+60);
$("date").min=iso(now);$("date").max=iso(max);$("date").value=iso(now);
$("date").addEventListener("change",renderSlots);
$("form").hidden=true;$("subtitle").textContent="Chargement…";
(fixed?db.doc("public/"+fixed).get().then(d=>d.exists?[d]:[]):db.collection("public").get().then(s=>s.docs)).then(docs=>{
  docs.forEach(d=>{const x=d.data();if(x.active)VENUES[d.id]=x});
  const ids=Object.keys(VENUES).sort((a,b)=>VENUES[a].name.localeCompare(VENUES[b].name,"fr"));
  if(!ids.length){closed(fixed&&docs.length?"Les réservations en ligne sont fermées pour cet établissement. Merci d'appeler le restaurant.":"Aucune réservation en ligne n'est ouverte pour le moment.");return}
  venue=ids[0];$("form").hidden=false;$("subtitle").textContent="Choisissez votre restaurant et votre créneau";
  renderVenues();renderSlots();askConsent();
}).catch(()=>closed("La page n'a pas pu se charger. Réessayez dans un instant ou appelez le restaurant."));
</script>
</body>
</html>
