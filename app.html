<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Servioresa — Espace équipe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : bandeau (établissement + modules en onglets), barre d'outils du module, puis contenu. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --sunken:#e9edf4; --ink:#1b2333; --muted:#5d6880; --line:#d6dce8;
  --accent:#2f5bd8; --accent-ink:#ffffff; --accent-soft:#e1e9fd;
  --reserve:#a8660c; --reserve-soft:#fbecd0; --occupe:#2f5bd8; --occupe-soft:#d9e4fc;
  --danger:#b3372f; --danger-soft:#f7dcd9; --decor:#c5ccd9;
  --s1:#2f5bd8; --s2:#d1962a; --s3:#2a9d8f; --s4:#c8473d; --s5:#7d5aa6;
  --side:#1f2a44; --side-ink:#c3cde3; --side-on:#ffffff; --side-hi:#31406a;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.top select{width:auto;font-weight:600}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav a{padding:9px 13px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--ink);border-color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#bar input,#bar select{width:auto}
#bar .grow{flex:1 1 180px}
#bar .sp{flex:1 1 0}
.note{background:var(--reserve-soft);border-radius:8px;padding:8px 12px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;border-block:1px solid var(--line);padding-block:12px}
.stat b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-right:6px}
.stat span{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:900px){.cols,.two{grid-template-columns:minmax(0,1fr)}}
.pane{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.res{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.res.off{opacity:.6}
.res .time{font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.res .name{font-weight:600;overflow-wrap:anywhere}
.res .meta{color:var(--muted);font-size:13px;grid-column:2/4;overflow-wrap:anywhere}
.res .acts{grid-column:1/4;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.res .acts select{width:auto;padding:4px 8px;font-size:13px}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap;background:var(--sunken);color:var(--muted);display:inline-block}
.pill.confirmee,.pill.arrivee,.pill.attente,.pill.pending{background:var(--reserve-soft);color:var(--reserve)}
.pill.installee,.pill.payee{background:var(--occupe-soft);color:var(--occupe)}
.pill.annulee,.pill.noshow{background:var(--danger-soft);color:var(--danger)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 16px;color:var(--muted);text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll svg.plan{display:block;width:100%;min-width:820px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--muted)}
.legend .l-res{background:var(--reserve-soft);border-color:var(--reserve)} .legend .l-occ{background:var(--occupe);border-color:var(--occupe)}
.tbl{cursor:pointer}
.tbl .shape{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.tbl.reservee .shape{fill:var(--reserve-soft);stroke:var(--reserve)}
.tbl.occupee .shape{fill:var(--occupe);stroke:var(--occupe)}
.tbl.sel .shape{stroke:var(--ink);stroke-width:4}
.tbl text{fill:var(--ink);font-family:var(--body);font-weight:600;text-anchor:middle;pointer-events:none}
.tbl.occupee text{fill:var(--accent-ink)}
.tbl:focus-visible{outline:none}.tbl:focus-visible .shape{stroke:var(--accent);stroke-width:5}
.decor rect{fill:var(--decor)} .decor text{fill:var(--muted);font-family:var(--body);font-size:15px;font-weight:600;text-anchor:middle;letter-spacing:.08em}
table.data{border-collapse:collapse;width:100%;min-width:640px}
table.data th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th[data-act]{cursor:pointer}
table.data td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.data tr:last-child td{border-bottom:0}
table.data .num{text-align:right;font-variant-numeric:tabular-nums}
.tt{display:grid;grid-auto-rows:34px;min-width:max-content}
.tt .hd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:8px 4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.tt .lab{padding:7px 10px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line)}
.tt .lab small{color:var(--muted);font-weight:400}
.tt .sec{grid-column:1/-1;padding:8px 10px;background:var(--sunken);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tt .cell{border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:transparent;cursor:pointer;padding:0}
.tt .cell:hover{background:var(--accent-soft)}
.tt .blk{margin:3px 2px;border-radius:6px;border:0;background:var(--reserve-soft);color:var(--ink);font-size:12px;font-weight:600;padding:0 7px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.tt .blk.installee,.tt .blk.payee{background:var(--occupe);color:var(--accent-ink)} .tt .blk.terminee{background:var(--sunken);color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.cal button{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal button.today{border-color:var(--accent)} .cal button.cur{background:var(--accent-soft)}
.cal .d{font-family:var(--display);font-weight:700}
.cal .c{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .bar{fill:var(--accent)} .chart .grid{stroke:var(--line);stroke-width:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chart .val{fill:var(--ink);font-weight:600}
.chartrow{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:start}
@media (max-width:900px){.chartrow{grid-template-columns:minmax(0,1fr)}}
.lg{display:flex;flex-direction:column;gap:7px;font-size:13px}
.lg b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.lg span.k{display:flex;gap:7px;align-items:center;border-top:1px solid var(--line);padding-top:7px}
.lg i,.split i{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.lg em{font-style:normal;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunken)}
.split i{height:14px;border-radius:0;width:auto}
.stack{display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.kv span:nth-child(even){font-weight:600;text-align:right}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field.full{grid-column:1/3}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--ink)}
.checks label{display:flex;gap:6px;align-items:center}.checks input{width:auto}
.warn{color:var(--reserve);font-size:13px}.err{color:var(--danger);font-size:13px}
.dacts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dacts div{display:flex;gap:8px}
.muted{color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:500;max-width:calc(100vw - 32px);z-index:50}
nav a{display:flex;align-items:center;gap:8px}
nav a span{display:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fly{display:none}
select.st{border-left:4px solid var(--muted);width:auto;padding:4px 8px;font-size:13px;margin:0}
select.st.confirmee,select.st.pending,select.st.arrivee{border-left-color:var(--reserve)}
select.st.installee,select.st.payee{border-left-color:var(--occupe)}
select.st.annulee,select.st.noshow{border-left-color:var(--danger)}
.rp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1150px){.rp{grid-template-columns:minmax(0,1fr)}}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px}
.ps{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.tg button,.ps button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.tg button:hover,.ps button:hover,.mc button:hover{border-color:var(--muted);background:var(--accent-soft)}
.tg button.on,.ps button.on,.mc button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.mc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:13px}
.mc button{border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 0;cursor:pointer}
.mc button.today{border-color:var(--accent)}
.mc button.past{color:var(--muted)}.mc button.past.on{color:var(--accent-ink)}
.gr{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer}
.gr:hover{border-color:var(--accent)}
#bar h2{margin-right:8px}
.tabs{display:flex;flex-wrap:wrap;background:var(--sunken);border-radius:10px;margin-top:14px;overflow:hidden}
.tabb{border:0;border-bottom:2px solid transparent;background:transparent;padding:8px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.tabb.on{background:var(--surface);border-color:var(--accent)}
.tabb b{font-family:var(--display);font-size:16px}.tabb small{color:var(--muted)}
table.data tr.off{opacity:.6}
table.data .time{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.tchip{display:inline-block;min-width:40px;text-align:center;background:var(--sunken);border-radius:6px;padding:5px 9px;font-weight:600}
table.data select{width:auto;padding:3px 6px;font-size:12px;margin-top:6px}
@media (min-width:1000px){
  .wrap{display:grid;grid-template-columns:58px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:24px;align-items:start}
  .top{grid-column:1/3}
  nav{grid-column:1;grid-row:2/5;flex-direction:column;border-bottom:0;background:var(--side);border-radius:12px;padding:10px 8px;gap:2px;overflow:visible;position:sticky;top:12px}
  nav a{border-bottom:0;margin:0;border-radius:8px;color:var(--side-ink);padding:10px;justify-content:center;position:relative}
  nav a:hover span,nav a:focus-visible span{display:block;position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:var(--side);color:var(--side-on);padding:5px 10px;border-radius:6px;white-space:nowrap;z-index:20;font-size:13px}
  nav a:hover{background:var(--side-hi);color:var(--side-on)}
  nav a.on{background:var(--side-hi);color:var(--side-on);box-shadow:inset 3px 0 0 var(--accent-soft)}
  nav{z-index:20}
  .ni{position:relative}
  .ni:hover .fly,.ni:focus-within .fly{display:block;position:absolute;left:100%;top:0;padding-left:14px;z-index:30}
  .fly>div{background:var(--side);border-radius:10px;padding:8px;min-width:230px;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 20px rgba(20,30,60,.25)}
  .fly b{color:var(--side-on);padding:6px 10px;font-weight:600}
  .fly small{color:var(--side-ink);font-weight:400;margin-left:6px}
  .fly button{background:transparent;border:0;color:var(--side-ink);text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
  .fly button:hover,.fly button.on{background:var(--side-hi);color:var(--side-on)}
  #note,#bar,main{grid-column:2}
}
body{margin:0}
[hidden]{display:none!important}
#login{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#login form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
#login h1{text-align:center}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ===== Habillage Servioresa : même univers que la page de réservation (nuit marine, verre, or), bannière animée ===== */
:root{
  --bg:#1c2b2a; --surface:#243a39; --sunken:#1a2928; --ink:#f4efe4; --muted:#a9bab7; --line:#3a5351;
  --accent:#eef0f0; --accent-ink:#16211f; --accent-soft:rgba(225,231,231,.16); --gold:#eef0f0; --gold-2:#b4bdbe;
  --reserve:#f0c36d; --reserve-soft:#3d3217; --occupe:#9db3ff; --occupe-soft:#22306a;
  --danger:#ff9d94; --danger-soft:#4a2320; --decor:#4a6361;
  --s1:#eef0f0; --s2:#9db3ff; --s3:#5fc9bd; --s4:#ff8f85; --s5:#c3a2ef;
  --side:#152120; --side-ink:#a9bab7; --side-on:#ffffff; --side-hi:#2f4b49;
  --display:"Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1); color-scheme:dark;
 --acc:225,231,231; --gl:255,255,255; --on:#16211f; --deep:#16211f; --h1:#3f6f69; --h2:#7d8f90; --b1:#22383a; --b2:#2f5450; --b3:#56686a; --pop:#1f3231;
}
/* ----- thèmes : vert (par défaut), nuit, gold, blanc ----- */
:root[data-th="nuit"]{--bg:#0d1330;--surface:#161d45;--sunken:#0a0f28;--ink:#f1f3fb;--muted:#a5aed0;--line:#2c3566;--accent:#e8ecff;--accent-ink:#0d1330;--accent-soft:rgba(214,222,255,.16);--gold:#e8ecff;--gold-2:#a9b4e6;--decor:#3b4580;--s1:#e8ecff;--side:#080c22;--side-hi:#2c3566;--side-ink:#a5aed0;--acc:214,222,255;--on:#0d1330;--deep:#080c22;--h1:#3a4aa0;--h2:#5a64a8;--b1:#1b2456;--b2:#2a2f6b;--b3:#4a5390;--pop:#121a3f}
:root[data-th="gold"]{--bg:#17130d;--surface:#231d14;--sunken:#110e09;--ink:#f6efe2;--muted:#b9ad98;--line:#3f3524;--accent:#e6c079;--accent-ink:#1a1408;--accent-soft:rgba(230,192,121,.16);--gold:#e6c079;--gold-2:#b98d3e;--decor:#5a4a2c;--s1:#e6c079;--side:#100d08;--side-hi:#3f3524;--side-ink:#b9ad98;--acc:230,192,121;--on:#1a1408;--deep:#100d08;--h1:#6b5326;--h2:#8a6a2c;--b1:#2a2114;--b2:#4a3a1c;--b3:#7a5e2a;--pop:#1d1810}
:root[data-th="blanc"]{--bg:#f2f5f4;--surface:#ffffff;--sunken:#e6ebe9;--ink:#16211f;--muted:#5b6b68;--line:#d3dbd8;--accent:#1f4a45;--accent-ink:#ffffff;--accent-soft:rgba(31,74,69,.12);--gold:#1f4a45;--gold-2:#2f6f67;
  --reserve:#a8660c;--reserve-soft:#fbecd0;--occupe:#2f5bd8;--occupe-soft:#d9e4fc;--danger:#b3372f;--danger-soft:#f7dcd9;--decor:#c5d0cd;--s1:#1f4a45;--s2:#2f5bd8;--s3:#2a9d8f;--s4:#c8473d;--s5:#7d5aa6;
  --side:#ffffff;--side-ink:#5b6b68;--side-on:#ffffff;--side-hi:#e6ebe9;--acc:31,74,69;--gl:22,33,31;--on:#ffffff;--deep:#16211f;--h1:#bfe0d9;--h2:#dfe6e4;--pop:#ffffff;color-scheme:light}
:root[data-th="blanc"] .top,:root[data-th="blanc"] #login{--ink:#f4efe4;--muted:#a9bab7;--line:#3a5351;--surface:#243a39;--gl:255,255,255;--acc:225,231,231;--gold:#eef0f0;--gold-2:#b4bdbe;--on:#16211f;--h1:#3f6f69;--h2:#7d8f90;color:var(--ink)}
:root[data-th="blanc"] .card,:root[data-th="blanc"] .scroll,:root[data-th="blanc"] .empty,:root[data-th="blanc"] nav{background:#fff;border-color:var(--line);box-shadow:0 10px 30px rgba(22,33,31,.07)}
:root[data-th="blanc"] .card:hover{border-color:rgba(31,74,69,.45)}
:root[data-th="blanc"] dialog[open]{box-shadow:0 30px 80px rgba(22,33,31,.25)}
:root[data-th="blanc"] .btn:hover{box-shadow:0 8px 20px rgba(22,33,31,.12)}
/* réglages : sous-menu et sections */
.setnav{display:flex;flex-wrap:wrap;gap:8px}
.setnav .btn{padding:9px 16px}
.setwrap{display:flex;flex-direction:column;gap:14px}
.setwrap .two{display:flex;flex-wrap:wrap;gap:14px;margin-top:0!important}
.setwrap .two>.card{flex:1 1 420px;min-width:0}
.setwrap>.card{margin-top:0!important}
.sw{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(var(--gl),.05);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:transform .18s var(--ease),border-color .2s}
.sw button:hover{transform:translateY(-3px);border-color:var(--gold)}
.sw button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--acc),.25)}
.sw i{width:74px;height:46px;border-radius:10px;display:block;border:1px solid rgba(128,128,128,.35)}
.setwrap[data-set="etab"] [data-sec]:not([data-sec="etab"]),.setwrap[data-set="etab"] .two:not(:has([data-sec="etab"])){display:none}
.setwrap[data-set="options"] [data-sec]:not([data-sec="options"]),.setwrap[data-set="options"] .two:not(:has([data-sec="options"])){display:none}
.setwrap[data-set="online"] [data-sec]:not([data-sec="online"]),.setwrap[data-set="online"] .two:not(:has([data-sec="online"])){display:none}
.setwrap[data-set="meta"] [data-sec]:not([data-sec="meta"]),.setwrap[data-set="meta"] .two:not(:has([data-sec="meta"])){display:none}
.setwrap[data-set="google"] [data-sec]:not([data-sec="google"]),.setwrap[data-set="google"] .two:not(:has([data-sec="google"])){display:none}
.setwrap[data-set="apparence"] [data-sec]:not([data-sec="apparence"]),.setwrap[data-set="apparence"] .two:not(:has([data-sec="apparence"])){display:none}

html{background:var(--bg)}
body{font-feature-settings:"tnum" 1;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0}
body::before{width:620px;height:620px;left:-180px;top:-200px;background:var(--h1);opacity:.45;animation:drift1 20s ease-in-out infinite alternate}
body::after{width:540px;height:540px;right:-160px;bottom:-180px;background:var(--h2);opacity:.28;animation:drift2 24s ease-in-out infinite alternate}
.wrap{position:relative;z-index:1}
/* bannière */
.top{position:relative;overflow:hidden;border:1px solid rgba(var(--gl),.14);border-radius:22px;padding:22px 26px;background:linear-gradient(120deg,var(--b1),var(--b2) 35%,var(--b3) 70%,var(--b1));background-size:300% 100%;animation:bannerMove 16s ease-in-out infinite alternate,rise .7s var(--ease) both;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.top::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-120%);animation:shine 6s 1s ease-in-out infinite;pointer-events:none}
.top::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:18%;top:-120px;background:radial-gradient(circle,rgba(var(--acc),.5),transparent 65%);animation:float 9s ease-in-out infinite alternate;pointer-events:none}
.top>*{position:relative;z-index:1}
.top h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.01em;line-height:1}
.brand{height:54px;width:auto;display:block}
#login .brand{height:64px;margin:0 auto}
.top .tag{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:8px}
#who{display:inline-flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(var(--gl),.08);border:1px solid rgba(var(--gl),.14);color:var(--ink);animation:rise .6s .2s var(--ease) both;transition:border-color .2s,transform .2s var(--ease)}
#who:empty{display:none}
#who:hover{border-color:var(--gold);transform:translateY(-1px)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on);font-weight:800;font-size:14px;letter-spacing:.02em;box-shadow:0 0 0 0 rgba(var(--acc),.5);animation:halo 2.8s ease-out infinite}
.uname{display:flex;flex-direction:column;line-height:1.15;font-weight:700;font-size:14px}
.uname small{font-weight:600;font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(var(--acc),.5)}70%,100%{box-shadow:0 0 0 10px rgba(var(--acc),0)}}
/* boutons */
.btn{border-radius:999px;background:rgba(var(--gl),.07);border-color:var(--line);color:var(--ink);font-weight:600;transition:transform .18s var(--ease),box-shadow .2s var(--ease),background-color .2s,border-color .2s,color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.btn:active{transform:scale(.95);box-shadow:none}
.btn.primary{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--on);font-weight:800;box-shadow:0 10px 26px rgba(var(--acc),.28)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.8s 1.2s ease-in-out infinite}
.btn.primary:hover{box-shadow:0 14px 32px rgba(var(--acc),.4)}
.btn.on{background:linear-gradient(135deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--on);animation:pick .3s var(--ease)}
.btn.danger{color:var(--danger);border-color:rgba(255,157,148,.45)}
/* surfaces en verre */
.card,.stat,.pane>.card{border-radius:18px}
.card,table.data,.scroll,.empty{background:linear-gradient(180deg,rgba(var(--gl),.08),rgba(var(--gl),.035));border:1px solid rgba(var(--gl),.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
table.data{background:transparent;border:0;backdrop-filter:none}
.scroll{border-radius:18px;overflow:auto}
.card{box-shadow:0 18px 44px rgba(0,0,0,.28);transition:box-shadow .25s var(--ease),transform .25s var(--ease),border-color .25s}
.card:hover{border-color:rgba(var(--acc),.4)}
.stats b{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
.tabs{background:transparent;gap:8px;overflow:visible}
.tabb{border:1px solid rgba(var(--gl),.12);border-radius:16px;background:rgba(var(--gl),.05);color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s,background-color .2s;position:relative}
.tabb:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.tabb.on{border-color:var(--gold);background:rgba(var(--acc),.14);box-shadow:0 10px 26px rgba(var(--acc),.16)}
.tabb.on::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:3px;border-radius:3px;background:var(--gold);animation:grow .35s var(--ease)}
.tabb b{font-weight:800}
table.data th{color:var(--gold);letter-spacing:.08em}
table.data tbody tr{transition:background-color .15s}
table.data tbody tr:hover{background:rgba(var(--acc),.08)}
table.data tr.web td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
table.data tr.web .time::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:8px;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite}
.pill{border-radius:999px;font-weight:600}
.tchip{background:rgba(var(--acc),.16);color:var(--gold);border:1px solid rgba(var(--acc),.35);border-radius:10px}
input,select,textarea{background:rgba(var(--gl),.07);border-color:var(--line);color:var(--ink);border-radius:12px;transition:border-color .15s,box-shadow .15s,background-color .15s}
select option{background:var(--surface);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:var(--gold)!important;box-shadow:0 0 0 4px rgba(var(--acc),.18)!important;outline:none}
#toast{border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on);font-weight:700;box-shadow:0 14px 34px rgba(0,0,0,.4);animation:toastIn .35s var(--ease)}
dialog{background:var(--pop);color:var(--ink);border:1px solid rgba(var(--gl),.14)}
dialog[open]{animation:pop .28s var(--ease);border-radius:20px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(10,17,16,.6);backdrop-filter:blur(4px);animation:fade .25s}
#bar{animation:rise .5s .1s var(--ease) both}
#body.enter>*{animation:rise .5s var(--ease) both}
#body.enter>*:nth-child(2){animation-delay:.06s}#body.enter>*:nth-child(3){animation-delay:.12s}#body.enter>*:nth-child(4){animation-delay:.18s}#body.enter>*:nth-child(n+5){animation-delay:.24s}
#body.enter .stats .stat{animation:rise .5s var(--ease) both}
#body.enter .stats .stat:nth-child(2){animation-delay:.06s}#body.enter .stats .stat:nth-child(3){animation-delay:.12s}#body.enter .stats .stat:nth-child(4){animation-delay:.18s}#body.enter .stats .stat:nth-child(n+5){animation-delay:.24s}
#body.enter .tabb{animation:rise .45s var(--ease) both}
#body.enter .tabb:nth-child(2){animation-delay:.04s}#body.enter .tabb:nth-child(3){animation-delay:.08s}#body.enter .tabb:nth-child(4){animation-delay:.12s}#body.enter .tabb:nth-child(5){animation-delay:.16s}#body.enter .tabb:nth-child(6){animation-delay:.2s}
#body.enter table.data tbody tr{animation:rise .4s var(--ease) both}
#body.enter table.data tbody tr:nth-child(2){animation-delay:.04s}#body.enter table.data tbody tr:nth-child(3){animation-delay:.08s}#body.enter table.data tbody tr:nth-child(4){animation-delay:.12s}#body.enter table.data tbody tr:nth-child(n+5){animation-delay:.16s}
#body.enter svg.chart rect{transform-box:fill-box;transform-origin:bottom;animation:barUp .7s var(--ease) both}
.tg button,.ps button,.mc button{background:rgba(var(--gl),.06);border-color:var(--line);color:var(--ink);border-radius:10px;transition:transform .15s var(--ease),background-color .15s,border-color .15s}
.tg button:hover,.ps button:hover,.mc button:hover{background:rgba(var(--acc),.14);border-color:var(--gold);transform:translateY(-1px)}
.tg button:active,.ps button:active{transform:scale(.94)}
.tg button.on,.ps button.on,.mc button.on{background:linear-gradient(135deg,var(--gold),var(--gold-2));border-color:var(--gold);color:var(--on);animation:pick .25s var(--ease)}
.mc button{background:transparent;border-color:transparent}
.gr{background:rgba(var(--gl),.06);border-color:var(--line);color:var(--ink);transition:transform .15s var(--ease),border-color .15s}
.gr:hover{transform:translateX(3px)}
#login{background:radial-gradient(900px 520px at 12% 8%,var(--h1) 0,transparent 60%),radial-gradient(760px 520px at 92% 92%,var(--h2) 0,transparent 55%),var(--deep)}
#login form{background:linear-gradient(180deg,rgba(var(--gl),.1),rgba(var(--gl),.04));border:1px solid rgba(var(--gl),.14);border-radius:24px;backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .7s var(--ease) both}
#login h1{font-family:"Fraunces",Georgia,serif;font-size:38px}
#login form::before{content:"ESPACE ÉQUIPE";text-align:center;font-size:11px;font-weight:700;letter-spacing:.32em;color:var(--gold)}
@media (min-width:1000px){
  nav{background:linear-gradient(180deg,rgba(var(--gl),.1),rgba(var(--gl),.04));border:1px solid rgba(var(--gl),.12);backdrop-filter:blur(14px);box-shadow:0 18px 40px rgba(0,0,0,.35);border-radius:20px;animation:rise .6s .05s var(--ease) both}
  nav a{transition:background-color .2s,color .2s,transform .2s var(--ease)}
  nav a:hover{transform:scale(1.12);color:var(--gold);background:rgba(var(--acc),.12)}
  nav a.on{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on);box-shadow:0 8px 20px rgba(var(--acc),.3)}
  .ni:hover .fly,.ni:focus-within .fly{animation:flyIn .22s var(--ease) both}
  .fly>div{background:var(--pop);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .fly button{transition:background-color .15s,padding-left .2s var(--ease),color .15s}
  .fly button:hover{padding-left:16px;color:var(--gold)}
  .fly button.on{background:rgba(var(--acc),.16);color:var(--gold)}
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes flyIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pick{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes bannerMove{to{background-position:100% 0}}
@keyframes float{to{transform:translate(-90px,60px) scale(1.25)}}
@keyframes drift1{to{transform:translate(140px,100px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-120px,-90px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const path=k=>(k==="clients"||k==="staff")?k:"venues/"+vid+"/"+k;
function need(){ if(!db){toast("Enregistrement impossible : le carnet n'est pas connecté.");throw {code:"offline"}} }
async function put(k,id,data,label){ need(); const col=db.collection(path(k)); const ref=id?col.doc(id):col.doc(); await ref.set(data); log(label); return ref.id }
async function del(k,id,label){ need(); await db.collection(path(k)).doc(id).delete(); log(label) }
async function upVenue(patch,label){ need(); await db.doc("venues/"+vid).update(patch); log(label);
  /* la fiche publique suit le nom et les services de l'établissement */
  if(pub&&(patch.shifts||patch.name)){const v=Object.assign({},V(),patch);db.doc("public/"+vid).update({name:v.name,shifts:pubShifts(v)}).catch(()=>{})} }
const pubShifts=v=>(v.shifts||[]).map(s=>({name:s.name||"",start:s.start,end:s.end,days:s.days||[]}));
function log(text){ if(!db||!vid||!text)return; db.collection(path("logs")).doc().set({at:new Date().toISOString(),by:me||"",text:String(text).slice(0,300)}).catch(()=>{}) }
function fail(e){ if(!e||e.code==="offline")return; if(e.code==="permission-denied") toast("Accès refusé : ce compte n'est pas autorisé à modifier les données."); else if(e.code==="invalid_argument"){readOnly=true;note("Vous consultez ce carnet en lecture seule. Demandez un accès Contributeur pour le modifier.")} else if(e.code==="quota_exceeded") toast("Espace de stockage plein : supprimez d'anciennes données."); else toast("Enregistrement impossible pour le moment. Réessayez.") }
async function safe(fn,ok){ try{await fn(); if(ok)toast(ok)}catch(e){fail(e);paint()} }

function subVenue(){
  unsubs.forEach(u=>u()); unsubs=[]; res=[];menu=[];logs=[];pub=null;links=[];resLoaded=false;
  if(!db||!vid)return;
  const ko=()=>{};
  unsubs.push(db.collection("public").where("venue","==",vid).onSnapshot(s=>{links=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(l=>l.alias).sort((a,b)=>a.id.localeCompare(b.id));if(ui.view==="reglages"&&!E)paint()},ko));
  unsubs.push(db.doc("public/"+vid).onSnapshot(d=>{pub=d.exists?d.data():null;if(ui.view==="reglages"&&!E)paint()},ko));
  unsubs.push(db.collection(path("reservations")).onSnapshot(s=>{if(resLoaded)s.docChanges().forEach(c=>{const d=c.doc.data();if(c.type==="added"&&d.web)toast("Nouvelle réservation en ligne : "+d.name+", "+d.date+" "+d.time)});resLoaded=true;res=s.docs.map(d=>Object.assign({id:d.id},d.data()));linkWeb();if(!E)paint()},ko));
  unsubs.push(db.collection(path("menu")).onSnapshot(s=>{menu=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ui.view==="carte"&&!E)paint()},ko));
  unsubs.push(db.collection(path("logs")).orderBy("at","desc").limit(200).onSnapshot(s=>{logs=s.docs.map(d=>Object.assign({id:d.id},d.data()));resolveNames();if(ui.view==="journal"&&!E)paint()},ko));
}
async function resolveNames(){
  if(!user||!user.profiles)return; const ids=[...new Set(logs.map(l=>l.by).filter(i=>i&&!(i in names)))]; if(!ids.length)return;
  try{const ps=await user.profiles(ids);ids.forEach(i=>names[i]=(ps&&ps[i]&&ps[i].name)||"");if(ui.view==="journal"&&!E)paint()}catch(e){}
}

/* Une réservation en ligne arrive sans fiche client : on la rattache à la fiche du même téléphone, ou on la crée. */
let cliLoaded=false;const linking={};
function linkWeb(){
  if(!cliLoaded||!db||!vid)return;const v=vid;
  res.filter(r=>r.web&&!r.clientId&&!linking[r.id]).forEach(r=>{
    const ph=digits(r.phone);if(ph.length<8)return;linking[r.id]=1;
    const c=clients.find(c=>digits(c.phone)===ph),cid=c?c.id:"tel-"+ph;
    (c?Promise.resolve():db.doc("clients/"+cid).set({name:r.name,phone:r.phone,email:r.email||"",tags:[],note:"",createdAt:new Date().toISOString()}))
      .then(()=>db.doc("venues/"+v+"/reservations/"+r.id).update({clientId:cid})).catch(()=>{delete linking[r.id]});
  });
}
function start(){
  const timer=setTimeout(()=>note("Les données ne répondent pas encore. L'affichage peut être incomplet."),10000);
  const ko=e=>{clearTimeout(timer);if(e&&e.code==="permission-denied"){note("");$("#nav").innerHTML="";$("#bar").innerHTML="";$("#body").innerHTML='<div class="empty">Le compte '+esc(me)+" n'a pas accès à Servioresa. Demandez au responsable de vous ajouter dans Équipe, ou déconnectez-vous pour changer de compte.</div>"}else note("Les données ne sont plus accessibles sur cette page.")};
  if(me===OWNER)db.collection("leads").onSnapshot(s=>{leads=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt)));if(ui.view==="equipe"&&!E)paint()},()=>{});
  if(me===OWNER)db.collection("access").onSnapshot(s=>{access=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ui.view==="equipe"&&!E)paint()},()=>{});
  db.collection("venues").onSnapshot(s=>{
    if(!s.metadata.fromCache){clearTimeout(timer); if(!readOnly)note("")}
    venues=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.order||0)-(b.order||0));
    if(!vid||!V()){ let saved=null; try{saved=localStorage.getItem("cds-venue")}catch(e){} const v=venues.find(v=>v.id===saved)||venues[0]; if(v){setVenue(v.id);return} }
    mount();
  },ko);
  db.collection("clients").onSnapshot(s=>{clients=s.docs.map(d=>Object.assign({id:d.id},d.data()));cliLoaded=true;linkWeb();if((ui.view==="clients"||ui.view==="statistiques")&&!E)paint()},()=>{});
  db.collection("staff").onSnapshot(s=>{staff=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ui.view==="equipe"&&!E)paint()},()=>{});
}

/* ---------- services et créneaux ---------- */
function shiftsOf(day){const v=V();if(!v)return[];const all=v.shifts||[],wd=new Date(day+"T12:00:00").getDay();const on=all.filter(s=>(s.days||[]).includes(wd));return on.length?on:all}
function span(day){const ss=shiftsOf(day);if(!ss.length)return[1080,1440];let a=1e9,b=0;ss.forEach(s=>{const st=mins(s.start);let en=mins(s.end);if(en<=st)en+=1440;a=Math.min(a,st);b=Math.max(b,en)});return[a,b]}
function slots(day){const set=new Set();shiftsOf(day).forEach(s=>{const st=mins(s.start);let en=mins(s.end);if(en<=st)en+=1440;for(let m=st;m<en;m+=15)set.add(hm(m))});const a=[...set];if(!a.length)for(let m=720;m<1440;m+=15)a.push(hm(m));return a.sort((x,y)=>tkey(x)-tkey(y))}
const SORTS={time:(a,b)=>tkey(a.time)-tkey(b.time),name:(a,b)=>String(a.name).localeCompare(String(b.name),"fr"),covers:(a,b)=>(+a.covers||0)-(+b.covers||0),created:(a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||""))};
const ofDay=()=>{const d=P.sortDir==="desc"?-1:1,f=SORTS[ui.sortBy||P.sortBy]||SORTS.time;return res.filter(r=>r.date===ui.day).sort((a,b)=>d*f(a,b)||tkey(a.time)-tkey(b.time))};
function tstate(id,list){const rs=list.filter(r=>r.table===id);if(rs.some(r=>r.status==="installee"||r.status==="payee"))return"occupee";if(rs.some(r=>r.status==="confirmee"||r.status==="arrivee"||r.status==="pending"))return"reservee";return"libre"}

/* ---------- plan ---------- */
function planSVG(sec,list){
  const ts=sec.tables||[],dc=sec.decor||[];
  if(!ts.length) return '<div class="empty">Aucune table dans cette salle. Ajoutez-en dans Réglages.</div>';
  let x0=1e9,y0=1e9,x1=0,y1=0;[...ts,...dc].forEach(o=>{x0=Math.min(x0,o.x);y0=Math.min(y0,o.y);x1=Math.max(x1,o.x+o.w);y1=Math.max(y1,o.y+(o.h||o.w))});
  x0-=30;y0-=30;x1+=30;y1+=30;
  let s='<svg class="plan" viewBox="'+x0+" "+y0+" "+(x1-x0)+" "+(y1-y0)+'" role="group" aria-label="Plan de salle '+esc(sec.name)+'"><g class="decor">';
  dc.forEach(o=>{s+='<rect x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" rx="'+(o.type==="mur"?2:10)+'"></rect>';if(o.label)s+='<text x="'+(o.x+o.w/2)+'" y="'+(o.y+o.h/2+5)+'">'+esc(o.label)+"</text>"});
  s+="</g>";
  ts.forEach(t=>{
    const st=tstate(t.id,list),cx=t.x+t.w/2,cy=t.y+t.h/2,m=Math.min(t.w,t.h),fs=Math.max(11,Math.min(22,m*.38));
    s+='<g class="tbl '+st+(ui.sel===t.id?" sel":"")+'" data-act="pick" data-t="'+esc(t.id)+'" tabindex="0" role="button" aria-label="Table '+esc(t.name)+", "+t.seats+" couverts, "+(st==="libre"?"libre":st==="reservee"?"réservée":"occupée")+'">';
    s+=t.shape==="c"?'<ellipse class="shape" cx="'+cx+'" cy="'+cy+'" rx="'+t.w/2+'" ry="'+t.h/2+'"></ellipse>':'<rect class="shape" x="'+t.x+'" y="'+t.y+'" width="'+t.w+'" height="'+t.h+'" rx="5"></rect>';
    s+='<text x="'+cx+'" y="'+(cy+fs*.35)+'" font-size="'+fs+'">'+esc(t.name)+"</text></g>";
  });
  return s+"</svg>";
}

/* ---------- statuts : deux axes (pré-service, en service) ; `status` reste le statut de synthèse utilisé par les onglets et les rapports ---------- */
const PRE={pending:"En attente",booked:"Réservée",hold:"En option",noanswer:"Pas de réponse",wrongnumber:"Mauvais numéro",leftmsg:"Message laissé",confirmed:"Confirmée",late:"En retard",cancel:"Annulée"};
const SVC={pending:"En attente",waitarea:"En salle d'attente",bar:"Au bar",partarr:"Arrivée partielle (non installée)",arrived:"Arrivée (non installée)",partseat:"Partiellement installée",seated:"Installée",paid:"Payée",left:"Partie",noshow:"No-show"};
const PDEF=["pending","confirmed","cancel"],SDEF=["pending","partseat","seated","left","noshow"];
const derive=(p,s)=>p==="cancel"?"annulee":s==="noshow"?"noshow":s==="left"?"terminee":s==="paid"?"payee":s==="seated"||s==="partseat"?"installee":s==="arrived"||s==="partarr"||s==="waitarea"||s==="bar"?"arrivee":p==="confirmed"||p==="booked"||p==="late"?"confirmee":"pending";
const preOf=r=>r.pre||({annulee:"cancel",pending:"pending"}[r.status]||"confirmed");
const svcOf=r=>r.svc||({arrivee:"arrived",installee:"seated",payee:"paid",terminee:"left",noshow:"noshow"}[r.status]||"pending");
const stKeys=(kind,cur)=>{const map=kind==="p"?PRE:SVC,def=kind==="p"?PDEF:SDEF,on=(V()||{}).stOn||[];return Object.keys(map).filter(k=>def.includes(k)||on.includes(kind+":"+k)||k===cur)};
const pill=t=>'<span class="pill">'+esc(t)+"</span>";
const inShift=(t,s)=>{const st=mins(s.start);let en=mins(s.end),x=mins(t);if(en<=st)en+=1440;if(x<st)x+=1440;return x>=st&&x<en};
const durTxt=n=>Math.floor(n/60)+" h"+(n%60?" "+pad(n%60):"");
function stSel(r){
  if(r.status==="attente") return ['<span class="pill attente">Liste d\'attente</span>','<button class="btn small" data-act="unwait" data-id="'+esc(r.id)+'">Confirmer</button>'];

  return [mk("pre",PRE,stKeys("p",p),p),mk("svc",SVC,stKeys("s",s),s)];
}
function setSt(r,p,s){const st=derive(p,s);safe(()=>put("reservations",r.id,Object.assign({},r,{pre:p,svc:s,status:st},stamp(r,st)),"Statut « "+PRE[p]+" / "+SVC[s]+" » : "+r.name+", "+r.date+" "+r.time),"Statut : "+STAT[st])}

  save:x=>put("clients",c&&c.id,Object.assign({},c||{createdAt:new Date().toISOString()},x),(c?"Client modifié : ":"Client créé : ")+x.name),del:c?()=>del("clients",c.id,"Client supprimé : "+c.name):null})}

function formStaff(s){openForm({title:s?"Modifier le membre":"Nouveau membre",fields:[{k:"name",label:"Nom",req:1,full:1,value:s&&s.name},{k:"role",label:"Rôle",type:"select",options:ROLES,value:s?s.role:ROLES[2]},{k:"venue",label:"Établissement",type:"select",options:[["","Tous"]].concat(venues.map(v=>[v.id,v.name])),value:s?s.venue:vid},{k:"phone",label:"Téléphone",type:"tel",value:s&&s.phone},{k:"active",label:"Actif",type:"check",value:s?s.active!==false:true}],

function formVenue(){const v=V();openForm({title:"Établissement",fields:[{k:"name",label:"Nom",req:1,full:1,value:v.name},{k:"duration",label:"Durée d'une réservation (min)",type:"number",min:15,req:1,value:+v.duration||120},{k:"address",label:"Adresse",full:1,value:v.address},{k:"phone",label:"Téléphone",type:"tel",value:v.phone},{k:"website",label:"Site web",value:v.website},{k:"bookingUrl",label:"Adresse de la page de réservation en ligne (reservation.html sur votre site)",full:1,value:v.bookingUrl},{k:"tags",label:"Étiquettes de réservation, séparées par des virgules",full:1,type:"textarea",value:(v.tags||[]).join(", ")},{k:"guestTags",label:"Étiquettes client, séparées par des virgules",full:1,type:"textarea",value:(v.guestTags||[]).join(", ")},{k:"sources",label:"Sources, séparées par des virgules",full:1,value:(v.sources||[]).join(", ")}],

function formOpts(){const o=O();openForm({title:"Options de réservation",fields:[{k:"showRef",label:"Afficher le numéro de référence",type:"check",full:1,value:o.showRef},{k:"forceSource",label:"Source obligatoire",type:"check",full:1,value:o.forceSource},{k:"phoneReq",label:"Téléphone obligatoire",type:"check",full:1,value:o.phoneReq},{k:"emailReq",label:"E-mail obligatoire",type:"check",full:1,value:o.emailReq},{k:"autoAssign",label:"Attribuer automatiquement la plus petite table libre",type:"check",full:1,value:o.autoAssign},{k:"walkinStatus",label:"Statut par défaut d'un walk-in",type:"select",options:["arrivee","installee"].map(k=>[k,STAT[k]]),value:o.walkinStatus},{k:"maxParty",label:"Taille maximale d'un groupe (0 = sans limite)",type:"number",value:o.maxParty||0}],

function formPrefs(){const hrs=[];for(let m=0;m<1440;m+=30)hrs.push(hm(m));openForm({title:"Mes préférences",fields:[{k:"sortBy",label:"Trier les réservations par",type:"select",options:[["time","Heure"],["name","Nom"],["covers","Couverts"],["created","Date de création"]],value:P.sortBy},{k:"sortDir",label:"Ordre",type:"select",options:[["asc","Croissant"],["desc","Décroissant"]],value:P.sortDir},{k:"defTime",label:"Heure proposée pour une nouvelle réservation",type:"select",full:1,options:hrs,value:P.defTime},{k:"stay",label:"Rester sur le formulaire après un ajout, pour saisir la suivante",type:"check",full:1,value:P.stay}],
  save:async x=>{Object.assign(P,x);saveP();paint()}})}
function exportCsv(){
  if(!EXP||!EXP.rows.length){toast("Ouvrez un rapport en tableau (Meilleurs clients, Rapport journalier…) pour l'exporter.");return}
  const q=c=>'"'+String(typeof c==="number"?String(Math.round(c*100)/100).replace(".",","):c==null?"":c).replace(/"/g,'""')+'"',csv="\ufeff"+[EXP.head].concat(EXP.rows).map(r=>r.map(q).join(";")).join("\r\n");
  const copy=()=>navigator.clipboard.writeText(csv).then(()=>toast("Tableau copié : collez-le dans Excel ou Google Sheets."),()=>toast("Export indisponible dans cette vue."));
  if(!dl){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=(EXP.file||EXP.name+"-"+ui.from+"-"+ui.to)+".csv";document.body.appendChild(a);a.click();a.remove();toast("Fichier téléchargé");return}catch(e){}}
  if(dl) dl.save({filename:(EXP.file||EXP.name+"-"+ui.from+"-"+ui.to)+".csv",data:csv}).then(()=>toast("Fichier enregistré"),e=>{if(!e||e.code!=="declined")copy()}); else copy();
}
function formShift(s){const v=V(),hrs=[];for(let m=0;m<1440;m+=30)hrs.push(hm(m));openForm({title:s?"Modifier le service":"Nouveau service",fields:[{k:"name",label:"Nom",req:1,full:1,value:s&&s.name},{k:"start",label:"Début",type:"select",options:hrs,value:s?s.start:"19:00"},{k:"end",label:"Fin",type:"select",options:hrs,value:s?s.end:"23:00"},{k:"days",label:"Jours",type:"multi",full:1,options:[1,2,3,4,5,6,0].map(d=>[d,DAYS[d]]),value:s?s.days:[0,1,2,3,4,5,6]}],
  save:x=>{const n={id:s?s.id:uid(),name:x.name,start:x.start,end:x.end,days:x.days.map(Number)};return upVenue({shifts:s?v.shifts.map(o=>o.id===s.id?n:o):(v.shifts||[]).concat([n])},"Service enregistré : "+x.name)},
  del:s?()=>upVenue({shifts:v.shifts.filter(o=>o.id!==s.id)},"Service supprimé : "+s.name):null})}
function formSection(i){const v=V(),secs=v.sections||[],s=i==null?null:secs[i];openForm({title:s?"Renommer la salle":"Nouvelle salle",fields:[{k:"name",label:"Nom de la salle",req:1,full:1,value:s&&s.name}],

function formTable(id){const v=V(),secs=v.sections||[],si=Math.min(ui.setSec,secs.length-1),sec=secs[si],t=id?sec.tables.find(t=>t.id===id):null;

  openForm({title:t?"Modifier la table":"Nouvelle table",fields:[{k:"name",label:"Nom ou numéro",req:1,value:t&&t.name},{k:"seats",label:"Couverts",type:"number",min:1,req:1,value:t?t.seats:4},{k:"shape",label:"Forme",type:"select",options:[["s","Carrée"],["r","Rectangulaire"],["c","Ronde"]],value:t?t.shape:"s"}],
  warn:x=>sec.tables.some(o=>o.id!==id&&String(o.name).toLowerCase()===String(x.name).toLowerCase())?"Une autre table porte déjà ce nom dans cette salle.":"",
  save:x=>{ if(t) return write(sec.tables.map(o=>o.id===id?Object.assign({},o,x):o)); const maxY=Math.max(0,...sec.tables.map(o=>o.y+o.h)),last=sec.tables.filter(o=>o.newRow===maxY).length,w=x.shape==="r"?70:50; return write(sec.tables.concat([Object.assign({id:uid(),x:40+last*90,y:maxY+60,w,h:50,newRow:maxY},x)])) },
  del:t?()=>{ if(res.some(r=>r.table===id&&r.date>=today&&ACTIVE.includes(r.status))){toast("Cette table a des réservations à venir : déplacez-les d'abord.");return Promise.reject({code:"offline"})} return write(sec.tables.filter(o=>o.id!==id)) }:null})}

/* ---------- interactions ---------- */
const A={
  day(d){ui.day=addDays(ui.day,+d.n);ui.sel=null;mount()}, today(){ui.day=today;ui.sel=null;mount()},
  month(d){const[y,m]=ui.month.split("-").map(Number),x=new Date(y,m-1+(+d.n),1);ui.month=iso(x).slice(0,7);mount()},
  goDay(d){ui.day=d.d;location.hash="reservations";if(ui.view==="reservations")mount()},
  tab(d){ui.tab=d.k;paint()}, sec(d){ui.sec=+d.i;ui.sel=null;paint()}, setSec(d){ui.setSec=+d.i;paint()},
  pick(d){ui.sel=ui.sel===d.t?null:d.t;paint()}, csort(d){ui.csort=d.k;paint()},
  newRes(d){formRes(null,{table:d.t,time:d.time,status:d.status})},
  walkin(){const n=new Date(),m=Math.round((n.getHours()*60+n.getMinutes())/15)*15;if(ui.day!==today){ui.day=today;mount()}formRes(null,{walkin:true,status:O().walkinStatus,time:hm(m)})},
  go(d){E=null;if(d.v==="reglages"&&d.o)ui.set=d.o;if(d.v==="statistiques"&&d.o)ui.rep=d.o;if(d.v==="reservations"&&d.o)ui.mode=d.o;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(location.hash.slice(1)===d.v||(!location.hash&&d.v==="reservations"))mount();else location.hash=d.v}, rep(d){ui.rep=d.k;paint()}, tsort(d){ui.tsort=d.k;paint()}, preset(d){ui.to=today;ui.from=addDays(today,-(+d.n-1));mount()},
  exportCsv(){exportCsv()}, importWeb(){formImport()}, editOnline(){formOnline()}, addLink(){formLink()}, editMeta(){formMeta()}, theme(d){setTheme(d.k);paint()}, editGoogle(){formGoogle()},
  copyLink(d){const u=location.origin+location.pathname.replace(/[^/]*$/,"")+"reserver.html?r="+d.id;navigator.clipboard.writeText(u).then(()=>toast("Lien copié"),()=>toast("Copie impossible ici : sélectionnez le lien à la main."))},
  delLink(d){const b=document.querySelector('[data-act="delLink"][data-id="'+d.id+'"]');if(b&&!b.dataset.sure){b.dataset.sure="1";b.textContent="Confirmer";return}if(!links.some(l=>l.id===d.id))return;safe(()=>db.doc("public/"+d.id).delete(),"Lien supprimé")},
  async seed(){try{need();const ex=await db.collection("venues").get();if(!ex.empty){toast("Les établissements existent déjà.");return}
    for(const id of Object.keys(SEED)){await db.doc("venues/"+id).set(SEED[id]);await db.doc("public/"+id).set(Object.assign({name:SEED[id].name,active:true,shifts:pubShifts(SEED[id]),maxGuests:12,lastOnline:id==="pti-versailles"?"22:00":"",pixel:"",gtag:"",gtm:""}))}
    toast("Établissements installés")}catch(e){fail(e)}},
  exportDay(){const rsh=(V().shifts||[]).find(s=>s.id===ui.rshift),rows=ofDay().filter(r=>!rsh||inShift(r.time,rsh)),cols=["time","name","phone","pre","svc","covers","table","source","gtype","tags","note","deposit","spend"];CS=cstat();if(!rows.length){toast("Aucune réservation à exporter pour ce jour.");return}EXP={name:"reservations",file:"reservations-"+ui.day,head:cols.map(k=>MCOLS[k][0]),rows:rows.map(r=>cols.map(k=>MCOLS[k][1](r)))};exportCsv()}, editStatuses(){formStatuses()},
  eDay(d){E.date=d.d;E.shift=-1;const sl=slots(E.date);if(!sl.includes(E.time))E.time=sl.includes(P.defTime)?P.defTime:sl[0];paint()},
  eMonth(d){const a=E.month.split("-").map(Number);E.month=iso(new Date(a[0],a[1]-1+(+d.n),1)).slice(0,7);paint()},
  eTime(d){E.time=d.t;paint()}, eShift(d){E.shift=+d.i;const s=shiftsOf(E.date)[E.shift];if(s&&!inShift(E.time,s))E.time=s.start;paint()},
  eCov(d){E.covers=+d.n;paint()}, eDur(d){E.duration=+d.n?Math.max(15,E.duration+(+d.n)):+V().duration||120;paint()},
  eTag(d){E.tags=E.tags.includes(d.t)?E.tags.filter(t=>t!==d.t):E.tags.concat([d.t]);paint()},
  ePick(d){const c=clients.find(c=>c.id===d.id);if(c){E.clientId=c.id;E.name=c.name;E.phone=c.phone||"";E.email=c.email||"";E.q="";paint()}},
  eUnpick(){E.clientId="";E.name="";E.phone="";E.email="";paint()},
  eCancel(){E=null;mount()}, eSave(d){saveRes(!!d.w)},
  eDel(){if(!E.del){E.del=true;mount();return}const r=E.orig;E=null;mount();safe(()=>del("reservations",r.id,"Réservation supprimée : "+r.name+", "+r.date+" "+r.time),"Supprimé")},
  unwait(d){const r=res.find(r=>r.id===d.id);if(r)setSt(r,preOf(r),svcOf(r))}, editOpts(){formOpts()}, editPrefs(){formPrefs()},
  editRes(d){const r=res.find(r=>r.id===d.id);if(r)formRes(r)},
  editClient(d){formClient(d.id?clients.find(c=>c.id===d.id):null)},
  editDish(d){formDish(d.id?menu.find(m=>m.id===d.id):null)},
  newAccess(){formAccess()},
  delLead(d){const b=document.querySelector('[data-act="delLead"][data-id="'+d.id+'"]');if(b&&!b.dataset.sure){b.dataset.sure="1";b.textContent="Confirmer";return}safe(()=>db.doc("leads/"+d.id).delete(),"Demande supprimée")},
  delAccess(d){safe(()=>db.doc("access/"+d.id).delete(),"Accès retiré")},
  editStaff(d){formStaff(d.id?staff.find(s=>s.id===d.id):null)},
  editVenue(){formVenue()}, editShift(d){formShift(d.id?(V().shifts||[]).find(s=>s.id===d.id):null)},
  editSection(d){formSection(d.i==null?null:+d.i)}, editTable(d){formTable(d.id||null)}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||(!V()&&el.dataset.act!=="seed"))return;const f=A[el.dataset.act];if(f)f(el.dataset)});

$("#body").addEventListener("input",e=>{const t=e.target,k=t.dataset&&t.dataset.e;if(!E||!k)return;E[k]=t.type==="number"?(t.value===""?"":+t.value):t.value;if(k==="q"){const g=$("#gres");if(g)g.innerHTML=gres()}});
